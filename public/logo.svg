<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 背景の丸（ブランドカラーの黄色） -->
  <circle cx="32" cy="32" r="30" fill="#f5b300"/>
  <circle cx="32" cy="32" r="30" fill="none" stroke="#0f1722" stroke-width="3"/>
  <!-- 蜂本体 -->
  <ellipse cx="32" cy="36" rx="14" ry="17" fill="#fbbf24"/>
  <ellipse cx="32" cy="36" rx="14" ry="17" fill="none" stroke="#0f1722" stroke-width="2.5"/>
  <!-- ストライプ -->
  <path d="M19 30 Q32 26 45 30" stroke="#0f1722" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M19 38 Q32 34 45 38" stroke="#0f1722" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M21 46 Q32 43 43 46" stroke="#0f1722" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- 翅 -->
  <ellipse cx="14" cy="24" rx="9" ry="5" fill="#ffffff" fill-opacity="0.92" stroke="#0f1722" stroke-width="2" transform="rotate(-25 14 24)"/>
  <ellipse cx="50" cy="24" rx="9" ry="5" fill="#ffffff" fill-opacity="0.92" stroke="#0f1722" stroke-width="2" transform="rotate(25 50 24)"/>
  <!-- 頭 -->
  <circle cx="32" cy="20" r="6" fill="#0f1722"/>
  <!-- 触覚 -->
  <line x1="29" y1="14" x2="26" y2="9" stroke="#0f1722" stroke-width="2" stroke-linecap="round"/>
  <line x1="35" y1="14" x2="38" y2="9" stroke="#0f1722" stroke-width="2" stroke-linecap="round"/>
  <circle cx="26" cy="9" r="1.5" fill="#0f1722"/>
  <circle cx="38" cy="9" r="1.5" fill="#0f1722"/>
</svg>
